# Cloudflare Worker & Container Configuration for DocShield (Repository Root)
# Architecture:
#   USER -> Cloudflare -> React/Vite Frontend (env.ASSETS)
#        -> Cloudflare Worker (/api/* routing)
#        -> Cloudflare Container (DocShieldBackendContainer on port 8000)
#        -> FastAPI (OCR / OpenCV / dlib / PyTorch / Risk Engine)
name = "docshield"
main = "worker.js"
compatibility_date = "2025-04-01"

[build]
command = "npm --prefix frontend ci && npm --prefix frontend run build"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[vars]
DOCSHIELD_ENV = "production"
DOCSHIELD_MODE = "PROTOTYPE"
FRONTEND_ORIGIN = "https://docshield.sivasankar-t1606.workers.dev"
BACKEND_ORIGIN = "https://docshield-production.up.railway.app"

# Cloudflare Container configuration for the FastAPI AI/CV backend
# Requires standard-2 (1 vCPU, 6 GiB RAM, 12 GB disk) or standard-1 (1/2 vCPU, 4 GiB RAM, 8 GB disk)
# because Peak RSS with PyTorch + EasyOCR + OpenCV + dlib is ~1.26 GB.
[[containers]]
class_name = "DocShieldBackendContainer"
image = "./backend/Dockerfile"
instance_type = "standard-2"
max_instances = 2

[[durable_objects.bindings]]
name = "DOCSHIELD_BACKEND"
class_name = "DocShieldBackendContainer"

[[migrations]]
new_sqlite_classes = ["DocShieldBackendContainer"]
tag = "v1"
