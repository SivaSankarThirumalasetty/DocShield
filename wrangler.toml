# Cloudflare Worker Configuration for DocShield (Repository Root)
# Deploys the compiled Vite production build (frontend/dist) via Cloudflare Workers Static Assets
name = "docshield"
main = "worker.js"
compatibility_date = "2025-04-01"

[build]
command = "npm --prefix frontend ci && npm --prefix frontend run build"

[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[vars]
BACKEND_ORIGIN = "https://docshield-production.up.railway.app"
